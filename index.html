<!doctype html><title>MediTrack — Milestone 2</title><link rel="stylesheet" href="style.css"><header><h1>MediTrack</h1><p>Milestone 2 · Doctors and scheduling</p></header><main><section><h2>Add patient</h2><form id="patient"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><button>Add</button></form></section><section><h2>Add doctor</h2><form id="doctor"><input name="name" placeholder="Doctor name" required><input name="specialty" placeholder="Specialty" required><button>Add</button></form></section><section><h2>Book appointment</h2><form id="appointment"><select name="patient_id" id="patients" required></select><select name="doctor_id" id="doctors" required></select><input name="slot" type="datetime-local" required><input name="reason" placeholder="Reason"><button>Book</button></form></section><section><h2>Appointments</h2><table><tbody id="appointments"></tbody></table></section></main><p id="toast"></p><script src="app.js"></script>
